<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打合せ調整</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --fg:#16202c; --muted:#6b7684; --line:#e2e6ea;
  --line2:#eef1f4; --accent:#2563eb; --accent-fg:#ffffff; --accent-soft:#eff5ff;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-line:#86efac;
  --maybe:#b45309; --maybe-bg:#fef3c7; --maybe-line:#fcd34d;
  --ng:#b91c1c; --ng-bg:#fee2e2; --ng-line:#fca5a5;
  --warn-bg:#fffbeb; --warn-line:#fde68a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
:root{
  --bg:#12161c; --card:#1a2029; --fg:#e6eaef; --muted:#9aa5b1; --line:#2b333e;
  --line2:#232a34; --accent:#4f8cf7; --accent-fg:#0b1017; --accent-soft:#1c2837;
  --ok:#4ade80; --ok-bg:#14351f; --ok-line:#22683a;
  --maybe:#fbbf24; --maybe-bg:#3a2c0c; --maybe-line:#78581a;
  --ng:#f87171; --ng-bg:#3d1a1a; --ng-line:#7a2f2f;
  --warn-bg:#2e2609; --warn-line:#6b571b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  font-size:15px; line-height:1.65; -webkit-text-size-adjust:100%;
}
.wrap{max-width:920px; margin:0 auto; padding:20px 16px 64px}
h1{font-size:19px; margin:0; letter-spacing:.01em}
h2{font-size:16px; margin:0 0 4px}
h3{font-size:14px; margin:0 0 8px; color:var(--muted); font-weight:600}
p{margin:0 0 10px}
a{color:var(--accent)}
header.top{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap}
header.top .logo{
  width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-fg);
  display:grid; place-items:center; font-size:15px; flex:none;
}
header.top .sub{color:var(--muted); font-size:12.5px; width:100%; margin-top:-4px}
header.top .home{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; border-radius:8px}
header.top .home:hover h1{text-decoration:underline}

.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow)}
.card.tight{padding:14px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px}
.field.inline{flex:1; min-width:150px; margin-bottom:0}
label{font-size:12.5px; font-weight:600; color:var(--muted)}
label .opt{font-weight:400; opacity:.75}
input[type=text],input[type=email],input[type=url],textarea,select{
  font:inherit; font-size:14.5px; color:var(--fg); background:var(--card);
  border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%;
}
textarea{resize:vertical; min-height:64px; line-height:1.5}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px}

button{font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:8px 14px; transition:filter .12s}
button:hover{filter:brightness(.97)}
button:active{transform:translateY(1px)}
.btn-primary{background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:600}
.btn-lg{padding:12px 22px; font-size:15.5px}
.btn-sm{padding:5px 10px; font-size:13px}
.btn-ghost{background:transparent; border-color:var(--line)}
.btn-link{background:none; border:none; color:var(--accent); padding:2px 4px; text-decoration:underline}
.btn-x{background:none; border:none; color:var(--muted); font-size:16px; padding:2px 7px; line-height:1; border-radius:6px}
.btn-x:hover{background:var(--ng-bg); color:var(--ng)}
button:disabled{opacity:.45; cursor:not-allowed}

.tabs{display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--line)}
.tabs button{border:none; background:none; border-radius:0; border-bottom:2px solid transparent; color:var(--muted); font-weight:600; padding:9px 12px}
.tabs button.on{color:var(--accent); border-bottom-color:var(--accent)}

.note{background:var(--accent-soft); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13.5px; margin-bottom:14px}
.note.warn{background:var(--warn-bg); border-color:var(--warn-line)}
.note.err{background:var(--ng-bg); border-color:var(--ng-line)}
.note h3{color:inherit; margin-bottom:6px; font-size:13.5px}
.note ul{margin:6px 0 0; padding-left:1.2em}
.note li{margin-bottom:3px}
.note :last-child{margin-bottom:0}

/* 日付カレンダー */
.cal{border:1px solid var(--line); border-radius:10px; padding:10px; max-width:340px}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
.cal-head .ym{font-weight:600; font-size:14.5px}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.cal-grid .wd{text-align:center; font-size:11px; color:var(--muted); padding:2px 0}
.cal-grid .wd.sat{color:#3b82f6} .cal-grid .wd.sun{color:#ef4444}
.cal-cell{aspect-ratio:1/1; display:grid; place-items:center; border-radius:7px; border:1px solid transparent; background:none; font-size:13.5px; padding:0; min-height:36px}
.cal-cell.pad{visibility:hidden}
.cal-cell.past{color:var(--muted); opacity:.4; cursor:not-allowed}
.cal-cell.sat{color:#3b82f6} .cal-cell.sun{color:#ef4444}
.cal-cell.on{background:var(--accent); color:var(--accent-fg); font-weight:700}
.cal-cell.today{border-color:var(--accent)}

/* 候補日 × 時刻のマトリクス */
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; align-items:center}
.tg-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px}
table.tg{border-collapse:separate; border-spacing:3px; width:auto; margin:0}
table.tg th,table.tg td{padding:0; border:none; background:none; white-space:nowrap; position:static}
.tg-h{border:none; background:none; color:var(--muted); font-size:12px; font-weight:600;
  padding:3px 7px; border-radius:6px; white-space:nowrap}
.tg-h:hover{background:var(--line2); color:var(--fg)}
.tg-c{display:block; width:100%; min-width:56px; height:29px; padding:0;
  border:1px solid var(--line); border-radius:6px; background:var(--card)}
.tg-c:hover{border-color:var(--accent); background:var(--accent-soft)}
.tg-c.on{background:var(--accent); border-color:transparent}

/* チェックボックス付きの小さなラベル */
.check{display:inline-flex; align-items:flex-start; gap:6px; cursor:pointer; font-size:12.5px; color:var(--muted)}
.check input{margin:2px 0 0; cursor:pointer; flex:none}
details.card > summary{font-size:14.5px; color:var(--fg); font-weight:600}
details.card > summary .hint{font-weight:400}

/* テーブル */
.tbl-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:14px}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line2); white-space:nowrap}
thead th{font-size:12px; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card)}
tbody tr:hover{background:var(--line2)}
th.c,td.c{text-align:center}
td.dt{font-weight:600}
tr.rank1 td.dt{color:var(--ok)}
.mark{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; font-size:14px; font-weight:700}
.mark.ok{background:var(--ok-bg); color:var(--ok)}
.mark.maybe{background:var(--maybe-bg); color:var(--maybe)}
.mark.ng{background:var(--ng-bg); color:var(--ng)}
.mark.none{background:var(--line2); color:var(--muted); font-weight:400}
.badge{display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid}
.badge.b1{background:var(--ok-bg); color:var(--ok); border-color:var(--ok-line)}
.badge.b2{background:var(--maybe-bg); color:var(--maybe); border-color:var(--maybe-line)}
.badge.b3{background:var(--ng-bg); color:var(--ng); border-color:var(--ng-line)}
.badge.b0{background:var(--line2); color:var(--muted); border-color:var(--line)}

/* 回答画面：何の打合せかを最初に伝える議題ブロック */
.agenda{margin:10px 0 0; padding:11px 13px; white-space:pre-wrap; font-size:14.5px; line-height:1.6;
  background:var(--accent-soft); border:1px solid var(--line); border-radius:9px}

/* 回答画面のセグメント */
.ans-day{margin-bottom:14px}
.ans-day .dh{font-weight:700; font-size:14px; padding:6px 0; border-bottom:1px solid var(--line); margin-bottom:6px}
.ans-row{display:flex; align-items:center; gap:10px; padding:7px 2px; flex-wrap:wrap}
.ans-row .time{flex:1; min-width:110px; font-size:15px; font-weight:600}
.ans-row .time .to{font-weight:400; color:var(--muted); font-size:13px}
.seg{display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:none}
.seg button{border:none; border-radius:0; padding:9px 0; width:52px; text-align:center; font-size:17px; background:var(--card); color:var(--muted); border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on.v2{background:var(--ok-bg); color:var(--ok); font-weight:700}
.seg button.on.v1{background:var(--maybe-bg); color:var(--maybe); font-weight:700}
.seg button.on.v0{background:var(--ng-bg); color:var(--ng); font-weight:700}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; margin-top:8px}
.legend span b{font-size:15px}

/* 発行済みMTGの索引一覧 */
.mlist{display:flex; flex-direction:column; gap:6px}
.mrow{display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--line2)}
.minfo{flex:1; min-width:0}
.mname{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mrow.done{opacity:.6; background:none}
.minfo .hint{font-size:12px; margin:0}
@media (max-width:560px){
  .mrow{flex-wrap:wrap}
  .minfo{flex-basis:100%}
}

/* 発行URL一覧 */
.plist{display:flex; flex-direction:column; gap:10px}
.pitem{border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:var(--line2)}
.pitem .nm{font-weight:700; margin-bottom:5px; font-size:14.5px}
.urlbox{display:flex; gap:6px; align-items:center}
.urlbox input{background:var(--card); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; padding:7px 9px}
.codebox{background:var(--line2); border:1px dashed var(--line); border-radius:9px; padding:11px 12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; word-break:break-all; user-select:all; margin-bottom:8px}
.hint{font-size:12.5px; color:var(--muted); margin-top:5px}
.stat{display:flex; gap:14px; flex-wrap:wrap; font-size:13.5px; color:var(--muted); margin-bottom:10px}
.stat b{color:var(--fg)}
details{margin-bottom:12px}
summary{cursor:pointer; font-size:13.5px; color:var(--accent); font-weight:600; padding:4px 0}
.sep{height:1px; background:var(--line); margin:16px 0}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:99}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
footer.foot{text-align:center; color:var(--muted); font-size:12px; margin-top:26px}
.actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px}
.prow{margin-bottom:8px; align-items:center}
@media (max-width:560px){
  .wrap{padding:14px 12px 56px}
  .card{padding:14px}
  .seg button{width:46px}
  th,td{padding:7px 6px}
  /* 横並びが折り返されると削除ボタンがどの行のものか分からなくなるため、行ごとに囲んで右上に固定する */
  .prow{position:relative; border:1px solid var(--line2); border-radius:9px; padding:10px 38px 10px 10px}
  .prow .btn-x{position:absolute; top:8px; right:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="#" class="home" title="最初の画面（進行中の一覧）に戻る">
      <div class="logo">📅</div>
      <h1>打合せ調整</h1>
    </a>
    <div class="sub">サーバー・API不要。候補日程はURLに、回答はコードで受け取ります。</div>
  </header>
  <main id="view"></main>
  <footer class="foot">単一HTMLで動作 / 外部送信なし</footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   ユーティリティ
   ============================================================ */
const $ = s => document.querySelector(s);
const view = $('#view');
const WD = ['日','月','火','水','木','金','土'];
const P2 = n => String(n).padStart(2,'0');

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 1900);
}
async function copy(text, msg){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    // クリップボードAPIが使えない環境（file:// の一部ブラウザ等）向けの退避策
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){ }
    ta.remove();
  }
  toast(msg || 'コピーしました');
}

/* URL安全なbase64 <-> バイト列 */
function b64enc(bytes){
  let bin = '';
  for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(str){
  const b64 = str.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
/* オブジェクト <-> URL文字列。先頭1文字が形式タグ（z=圧縮 / j=非圧縮）。
   日本語はUTF-8で1文字3バイトになりURLが伸びるため、可能なら圧縮する。 */
const HAS_CS = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
async function squeeze(bytes, mode){
  const s = new (mode==='in' ? CompressionStream : DecompressionStream)('deflate-raw');
  const w = s.writable.getWriter();
  w.write(bytes); w.close();
  return new Uint8Array(await new Response(s.readable).arrayBuffer());
}
async function encB(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (HAS_CS){
    try{
      const z = await squeeze(bytes, 'in');
      if (z.length < bytes.length) return 'z' + b64enc(z);
    }catch(e){ /* 非対応環境では非圧縮で続行 */ }
  }
  return 'j' + b64enc(bytes);
}
async function decB(str){
  const tag = str[0];
  let bytes;
  if (tag === 'z')      bytes = await squeeze(b64dec(str.slice(1)), 'out');
  else if (tag === 'j') bytes = b64dec(str.slice(1));
  else                  bytes = b64dec(str);   // タグなし（将来の互換用）
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* イベント指紋。件名・候補・参加者が同じなら同一とみなす（備考の修正では変わらない） */
function fpOf(ev){
  const src = (ev.t||'') + '|' + (ev.s||[]).join(',') + '|' + (ev.p||[]).map(p=>p[0]).join(',');
  let h = 0x811c9dc5;
  for (let i=0;i<src.length;i++){ h ^= src.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h>>>0).toString(36).slice(-5);
}

/* 日時文字列 "YYYYMMDDhhmm" のヘルパ */
function slotLabel(s){
  const y=+s.slice(0,4), mo=+s.slice(4,6), d=+s.slice(6,8);
  return `${mo}/${d}(${WD[new Date(y,mo-1,d).getDay()]}) ${s.slice(8,10)}:${s.slice(10,12)}`;
}
function dateLabel(d){
  const y=+d.slice(0,4), mo=+d.slice(4,6), da=+d.slice(6,8);
  return `${y}年${mo}月${da}日(${WD[new Date(y,mo-1,da).getDay()]})`;
}
function mdLabel(d){
  const y=+d.slice(0,4), mo=+d.slice(4,6), da=+d.slice(6,8);
  return `${mo}/${da}(${WD[new Date(y,mo-1,da).getDay()]})`;
}
function timeLabel(s){ return s.slice(8,10)+':'+s.slice(10,12); }
function addMin(s, min){
  const dt = new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8), +s.slice(8,10), +s.slice(10,12)+min);
  return `${dt.getFullYear()}${P2(dt.getMonth()+1)}${P2(dt.getDate())}${P2(dt.getHours())}${P2(dt.getMinutes())}`;
}
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}${P2(d.getMonth()+1)}${P2(d.getDate())}`;
}

/* ============================================================
   状態
   ============================================================ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};

function emptyEvent(){
  // k  = 事前発行したGoogle Meetのリンク。あれば確定時に自動で埋め込む
  // rm = 回答の返信先メールアドレス。あれば参加者画面に「メールで返信」ボタンが出る
  return { v:1, t:'', o:'', m:60, l:'', k:'', rm:'', d:'', p:[['',''],['','']], s:[] };
}
let S = {
  ev: emptyEvent(),
  evB64: '',              // ev のエンコード結果（URL組み立てを同期で行うためのキャッシュ）
  cal: null,              // {y, m} カレンダー表示月
  dates: new Set(),       // カレンダーで選んだ候補日
  slots: new Set(),       // 候補そのもの（"YYYYMMDDhhmm"）。日付ごとに違う時刻を選べる
  base: '',               // 配布用ベースURL（prefs.base の作業用コピー）
  tab: 'issue',           // 管理画面のタブ
  replies: [],            // [{i, a, c}]
  ans: {},                // 回答画面: slotIndex -> '0'|'1'|'2'
  myIdx: 0,
  fixed: null,            // 確定した候補
  // 打合せごとに変わらない設定。毎回入れ直さなくていいようフォーム本体から分離してある
  prefs: LS.get('mtg.prefs', {o:'', k:'', rm:'', base:''}),
  brokenDraft: false,     // 旧版の不具合で参加者が失われた下書きを復元したか
  showMail: null,         // 参加者のメール欄を出すか（null = 入力済みなら自動で出す）
  half: false,            // 開始時刻を30分刻みで出すか
};

/* ============================================================
   ルーティング
   ============================================================ */
async function route(){
  const h = location.hash.replace(/^#/, '');
  try{
    if (h.startsWith('r=')){
      const [b, idx] = h.slice(2).split('~');
      S.ev = await decB(b);
      S.evB64 = b;
      S.myIdx = Math.max(0, parseInt(idx||'0', 10) || 0);
      return renderRespond();
    }
    if (h.startsWith('m=')){
      S.evB64 = h.slice(2);
      S.ev = await decB(S.evB64);
      loadDraftMeta();
      saveToList();   // 以前発行したURLを開いた場合も索引に載せる
      return renderManage();
    }
  }catch(e){
    return renderBroken(e);
  }
  // 新規作成（下書きがあれば復元）
  const draft = LS.get('mtg.draft', null);
  if (draft && draft.ev){
    const ev = draft.ev;
    // 候補が確定済み（発行後）なのに参加者が消えている下書きは壊れている。
    // 旧版に、集計画面での入力が下書きを空で上書きしてしまう不具合があったため。
    // 候補や件名は活かしたまま、参加者の再入力を促す状態に戻す
    const broken = (ev.s || []).length > 0 && !(ev.p || []).some(p => p && p[0]);
    S.dates = new Set(draft.dates || []);
    S.slots = draft.slots ? new Set(draft.slots) : slotsFromLegacy(draft);
    S.brokenDraft = broken;
    S.ev = broken ? {...ev, p:[['',''],['','']], s:[]} : ev;
  }
  S.base = S.prefs.base || '';
  renderCreate();
}

/* ============================================================
   候補スロットの生成 / 逆算
   ============================================================ */
function buildSlots(){ return [...S.slots].sort(); }
function loadDraftMeta(){
  S.slots = new Set(S.ev.s || []);
  S.dates = new Set([...S.slots].map(s => s.slice(0, 8)));
  S.base = S.prefs.base || '';
}
/* 旧形式の下書き（日付×時刻の直積＋除外リスト）を、候補の集合に変換する */
function slotsFromLegacy(draft){
  const ex = new Set(draft.excl || []), out = new Set();
  for (const d of (draft.dates || [])) for (const t of (draft.times || [])){
    if (!ex.has(d + t)) out.add(d + t);
  }
  return out;
}
function saveDraft(){
  LS.set('mtg.draft', {ev:S.ev, dates:[...S.dates], slots:[...S.slots]});
}

/* ============================================================
   発行したMTGの索引
   どの回答コードがどのMTGのものかを主催者が判断しなくて済むようにするための一覧。
   データの原本はURLなので、これはあくまで探す手間を省く索引。
   ============================================================ */
function loadList(){ return LS.get('mtg.list', []); }
function repliesOf(fp){ return LS.get('mtg.rep.' + fp, []); }
function answeredCount(fp){ return new Set(repliesOf(fp).map(r => r.i)).size; }
function saveToList(){
  const list = loadList(), fp = fpOf(S.ev);
  const i = list.findIndex(x => x.fp === fp);
  const prev = i >= 0 ? list[i] : null;
  const entry = {fp, t:S.ev.t, b:S.evB64, n:S.ev.s.length, p:S.ev.p.map(x => x[0]),
                 at: prev ? prev.at : Date.now()};        // 既存なら発行日時を保つ
  if (prev && prev.done) entry.done = prev.done;          // 「済」も維持する
  if (prev) list[i] = entry; else list.unshift(entry);
  LS.set('mtg.list', list.slice(0, 20));   // 増えすぎないよう古いものから落とす
}

/* 貼られたテキストから回答コードを拾い、指紋を見て該当MTGへ自動で振り分ける */
async function fileCodes(text){
  const found = text.match(/MTG1:[A-Za-z0-9_-]+/g) || [];
  const list = loadList();
  const ok = [], unknown = [], bad = [];
  for (const token of found){
    let r;
    try{ r = await decB(token.slice(5)); }
    catch(e){ bad.push('コードが壊れています（途中で切れている可能性があります）'); continue; }
    const m = list.find(x => x.fp === r.h);
    if (!m){ unknown.push(r); continue; }
    if (typeof r.i !== 'number' || !(m.p || [])[r.i]){ bad.push('参加者を特定できないコードです'); continue; }
    if (typeof r.a !== 'string' || r.a.length !== m.n){ bad.push(`「${m.t}」の候補数と一致しないコードです`); continue; }
    const reps = repliesOf(m.fp).filter(x => x.i !== r.i);   // 同じ人の再回答は上書き
    reps.push({i:r.i, a:r.a, c:r.c || ''});
    LS.set('mtg.rep.' + m.fp, reps);
    ok.push({t:m.t, name:m.p[r.i]});
  }
  return {ok, unknown, bad, total:found.length};
}

/* ============================================================
   画面1: 作成（先頭に発行済みMTGの一覧を出す）
   ============================================================ */
function renderList(){
  const list = loadList();
  if (!list.length) return '';
  // 調整中を上、確定済みを下へ。同じ区分の中では新しく発行したものから並べる
  const sorted = [...list].sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || (b.at || 0) - (a.at || 0));
  const active = sorted.filter(m => !m.done).length;
  const rows = sorted.map(m => {
    const got = answeredCount(m.fp), total = (m.p || []).length;
    const d = new Date(m.at || 0);
    return `<div class="mrow${m.done ? ' done' : ''}">
      <div class="minfo">
        <div class="mname">${esc(m.t || '(件名なし)')}</div>
        <p class="hint">${m.at ? `${d.getMonth()+1}/${d.getDate()}発行` : ''}${(m.p||[]).length ? ' ／ ' + esc((m.p||[]).join('、')) : ''}</p>
      </div>
      ${m.done
        ? `<span class="badge b1">済 ${esc(slotLabel(m.done))}</span>
           <button class="btn-sm btn-ghost" data-undone="${m.fp}" title="調整中に戻す">戻す</button>`
        : `<span class="badge ${total > 0 && got >= total ? 'b1' : 'b0'}">${got}/${total}名</span>`}
      <button class="btn-sm" data-open="${m.fp}">開く</button>
      <button class="btn-x" data-drop="${m.fp}" title="一覧から削除">✕</button>
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>日程調整の一覧 <span class="badge ${active ? 'b0' : 'b1'}">${active ? `調整中 ${active}件` : 'すべて確定済み'}</span></h2>
    <div class="mlist" style="margin:12px 0 0">${rows}</div>
    <div class="sep"></div>
    <h3>回答コードを貼る <span class="hint" style="font-weight:400">（どのMTGのものでもここでOK）</span></h3>
    <textarea id="lpaste" placeholder="届いたメールやチャットの文章をそのまま貼り付け。複数人・複数MTGが混ざっていても自動で振り分けます"></textarea>
    <div class="actions"><button class="btn-primary" id="lload">読み込む</button></div>
    <div id="lerr"></div>
  </div>`;
}

function bindList(){
  view.querySelectorAll('[data-open]').forEach(b => b.onclick = ()=>{
    const m = loadList().find(x => x.fp === b.dataset.open);
    if (m) location.hash = 'm=' + m.b;
  });
  view.querySelectorAll('[data-undone]').forEach(b => b.onclick = ()=>{
    const list = loadList(), i = list.findIndex(x => x.fp === b.dataset.undone);
    if (i >= 0){ delete list[i].done; LS.set('mtg.list', list); }
    syncForm(); renderCreate();
  });
  view.querySelectorAll('[data-drop]').forEach(b => b.onclick = ()=>{
    const m = loadList().find(x => x.fp === b.dataset.drop);
    if (!m) return;
    if (!confirm(`「${m.t}」を一覧から削除します。\n受け取った回答も消えます。\n（発行済みURLが残っていれば、そこから開き直せます）`)) return;
    LS.set('mtg.list', loadList().filter(x => x.fp !== m.fp));
    localStorage.removeItem('mtg.rep.' + m.fp);
    syncForm(); renderCreate();
  });
  const ll = $('#lload');
  if (!ll) return;
  ll.onclick = async ()=>{
    const txt = $('#lpaste').value;
    if (!txt.trim()){ toast('回答コードを貼り付けてください'); return; }
    const {ok, unknown, bad, total} = await fileCodes(txt);
    const msgs = [];
    if (ok.length) msgs.push(`<div class="note" style="margin:12px 0 0">${
      ok.map(x => `<b>${esc(x.t)}</b> … ${esc(x.name)}さんの回答を読み込みました。`).join('<br>')}</div>`);
    const errs = [];
    if (!total) errs.push('「MTG1:」で始まる回答コードが見つかりませんでした。貼り付けた内容を確認してください。');
    if (unknown.length) errs.push(`${unknown.length}件は上の一覧にないMTGの回答です。別の端末で発行したか、候補日程を変更した可能性があります。`);
    errs.push(...new Set(bad));
    if (errs.length) msgs.push(`<div class="note err" style="margin:12px 0 0"><ul style="margin:0">${
      errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`);
    syncForm();        // 入力途中の内容を退避してから
    renderCreate();    // 一覧の回答数を更新する
    if (msgs.length) $('#lerr').innerHTML = msgs.join('');
  };
}

function syncForm(){
  // view に張った input リスナーは画面遷移後も生き続けるため、管理画面や回答画面での入力でも発火する。
  // 作成画面が出ていないときに走ると S.ev の件名と参加者が空になり、
  // イベント指紋が変わって発行済みの回答コードが「別の打合せ」と誤判定されてしまう
  if (!$('#f-t')) return;
  const g = id => { const el = $(id); return el ? el.value : ''; };
  S.ev.t = g('#f-t').trim();
  S.ev.m = parseInt(g('#f-m'), 10) || 60;
  S.ev.l = g('#f-l').trim();
  S.ev.d = g('#f-d');
  // 設定は開いているときだけDOMから読み、常に永続化する
  if ($('#p-o'))    S.prefs.o    = g('#p-o').trim();
  if ($('#p-k'))    S.prefs.k    = g('#p-k').trim();
  if ($('#p-rm'))   S.prefs.rm   = g('#p-rm').trim();
  if ($('#p-base')) S.prefs.base = g('#p-base').trim();
  LS.set('mtg.prefs', S.prefs);
  S.ev.o = S.prefs.o;
  S.ev.k = S.prefs.k;
  S.ev.rm = S.prefs.rm || '';
  S.base = S.prefs.base;
  const rows = view.querySelectorAll('[data-prow]');
  S.ev.p = [...rows].map(r => [
    r.querySelector('.p-name').value.trim(),
    r.querySelector('.p-mail').value.trim(),
  ]);
}

function renderCal(){
  const {y, m} = S.cal;
  const first = new Date(y, m-1, 1), pad = first.getDay();
  const days = new Date(y, m, 0).getDate();
  const tk = todayKey();
  let cells = '';
  for (let i=0;i<pad;i++) cells += `<button class="cal-cell pad" disabled></button>`;
  for (let d=1; d<=days; d++){
    const key = `${y}${P2(m)}${P2(d)}`;
    const wd = new Date(y, m-1, d).getDay();
    const cls = ['cal-cell'];
    if (wd===0) cls.push('sun'); if (wd===6) cls.push('sat');
    if (key < tk) cls.push('past');
    if (key === tk) cls.push('today');
    if (S.dates.has(key)) cls.push('on');
    cells += `<button class="${cls.join(' ')}" data-date="${key}"${key<tk?' disabled':''}>${d}</button>`;
  }
  $('#cal').innerHTML = `
  <div class="cal">
    <div class="cal-head">
      <button class="btn-sm btn-ghost" data-mv="-1">‹</button>
      <span class="ym">${y}年 ${m}月</span>
      <button class="btn-sm btn-ghost" data-mv="1">›</button>
    </div>
    <div class="cal-grid">
      ${WD.map((w,i)=>`<div class="wd${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('')}
      ${cells}
    </div>
  </div>
  <p class="hint">選択中：${S.dates.size}日</p>`;
  $('#cal').querySelectorAll('[data-mv]').forEach(b=>b.onclick = ()=>{
    let {y, m} = S.cal; m += +b.dataset.mv;
    if (m<1){ m=12; y--; } if (m>12){ m=1; y++; }
    S.cal = {y, m}; renderCal();
  });
  $('#cal').querySelectorAll('[data-date]').forEach(b=>b.onclick = ()=>{
    const k = b.dataset.date;
    if (S.dates.has(k)){
      S.dates.delete(k);
      [...S.slots].forEach(s => { if (s.startsWith(k)) S.slots.delete(s); });   // その日の候補も一緒に外す
    } else {
      S.dates.add(k);
    }
    renderCal(); renderGrid(); renderSlotList(); saveDraft();
  });
}

/* 候補日 × 時刻のマトリクス。マスをクリックして候補を1つずつ選ぶ。
   日付ごとに違う時刻を選べる。行(時刻)・列(日付)のヘッダーでまとめて選択/解除もできる */
function renderGrid(){
  const box = $('#tgrid');
  if (!box) return;
  const days = [...S.dates].sort();
  if (!days.length){
    box.innerHTML = `<div class="note" style="margin:0">
      <b>← まず左のカレンダーで候補日を選んでください</b>
      <p class="hint" style="margin:6px 0 0">選んだ日が列になった時間割がここに出ます。マスをクリックして候補にします。</p>
    </div>`;
    return;
  }
  // :30 を選んでいる状態で1時間刻みに戻すと選択が見えなくなるため、その場合は強制的に30分刻み表示
  const half = S.half || [...S.slots].some(s => s.slice(10) !== '00');
  const tgl = $('#halftgl');
  if (tgl) tgl.checked = half;
  const times = [];
  for (let h = 8; h <= 20; h++) for (const mi of (half ? ['00','30'] : ['00'])){
    if (h === 20 && mi === '30') continue;
    times.push(P2(h) + mi);
  }
  let html = `<table class="tg"><thead><tr><th></th>`;
  for (const d of days){
    html += `<th><button class="tg-h" data-col="${d}" title="この日をまとめて選択／解除">${esc(mdLabel(d))}</button></th>`;
  }
  html += `</tr></thead><tbody>`;
  for (const t of times){
    html += `<tr><th><button class="tg-h" data-row="${t}" title="この時刻を全日まとめて選択／解除">${+t.slice(0,2)}:${t.slice(2)}</button></th>`;
    for (const d of days){
      const k = d + t;
      html += `<td><button class="tg-c${S.slots.has(k) ? ' on' : ''}" data-cell="${k}"` +
              ` aria-label="${esc(mdLabel(d))} ${t.slice(0,2)}:${t.slice(2)}"></button></td>`;
    }
    html += `</tr>`;
  }
  box.innerHTML = html + `</tbody></table>`;

  const redraw = ()=>{ renderGrid(); renderSlotList(); saveDraft(); };
  box.querySelectorAll('[data-cell]').forEach(b => b.onclick = ()=>{
    const k = b.dataset.cell;
    S.slots.has(k) ? S.slots.delete(k) : S.slots.add(k);
    redraw();
  });
  box.querySelectorAll('[data-row]').forEach(b => b.onclick = ()=>{
    const t = b.dataset.row, on = days.every(d => S.slots.has(d + t));
    days.forEach(d => on ? S.slots.delete(d + t) : S.slots.add(d + t));
    redraw();
  });
  box.querySelectorAll('[data-col]').forEach(b => b.onclick = ()=>{
    const d = b.dataset.col, on = times.every(t => S.slots.has(d + t));
    times.forEach(t => on ? S.slots.delete(d + t) : S.slots.add(d + t));
    redraw();
  });
}

function renderSlotList(){
  const box = $('#slots');
  if (!box) return;
  // 候補そのものはマトリクスが表しているので、ここは件数の確認だけ
  const n = S.slots.size;
  if (!n){ box.innerHTML = ''; return; }
  const days = new Set([...S.slots].map(s => s.slice(0, 8)));
  let html = `<p class="hint" style="margin:0">選択中の候補：<b>${n}件</b>（${days.size}日間）</p>`;
  if (n > 24) html += `<div class="note warn" style="margin-top:10px">候補が${n}件あります。回答する側の負担が大きいので、10件前後に絞ると回答率が上がります。</div>`;
  box.innerHTML = html;
}

async function issue(){

  const slots = buildSlots();

function baseUrl(){
  if (S.base){
    const b = S.base.replace(/#.*$/, '').trim();
    // 「…/mtg」のようにディレクトリを指すURLは末尾スラッシュを補う。
    // 付けないとリダイレクトが挟まり、環境によってフラグメントが落ちる恐れがある
    // ホスト名の「.com」を拡張子と誤判定しないよう、プロトコル＋ホストを除いたパス部分だけで判定する
    const last = b.replace(/^[a-z]+:\/\/[^/]*/i, '').split('/').pop();
    return (/\/$/.test(b) || /\.[a-z0-9]{2,5}$/i.test(last)) ? b : b + '/';
  }
  return (location.origin === 'null' ? '' : location.origin) + location.pathname;
}

async function makeCode(){
  const e = S.ev, n = e.s.length;
  const missing = e.s.filter((_, k)=>S.ans[k]==null).length;
  if (missing && !confirm(`${missing}件が未回答です。未回答のまま回答コードを作りますか？\n（未回答は主催者側で「？」と表示されます）`)) return;
  let a = '';
  for (let k=0;k<n;k++) a += (S.ans[k] != null ? S.ans[k] : '9');
  const c = $('#f-c').value.trim();
  const payload = {v:1, h:fpOf(e), i:S.myIdx, a};
  if (c) payload.c = c;
  const code = 'MTG1:' + await encB(payload);
  const me = e.p[S.myIdx][0];
  // 主催者が複数のMTGを並行して調整していても取り違えないよう、件名にMTG名と回答者名を入れる
  const subject = `【日程調整の回答】${e.t} ／ ${me}`;
  const reply = [subject, code, c ? `\n補足：${c}` : null].filter(x=>x!==null).join('\n');
  // 宛先の @ はエンコードしない（古いメーラーが %40 を解釈できない場合があるため）
  const to = encodeURIComponent((e.rm || '').trim()).replace(/%40/g, '@');
  const qs = `subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(reply)}`;
  // mailto はOS既定のメールアプリ（Windowsでは多くの場合Outlook）が開く。
  // ブラウザのGmailを使っている人向けに、Gmailの作成画面を直接開く導線も併記する
  const mailHref  = to ? `mailto:${to}?${qs}` : '';
  const gmailHref = to ? `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&${qs.replace('subject=','su=')}` : '';

  const ok = e.s.filter((_, k)=>S.ans[k]==='2').length;
  const mb = e.s.filter((_, k)=>S.ans[k]==='1').length;
  const box = $('#result');
  box.innerHTML = `
  <div class="card">
    <h2>あと1ステップです</h2>
    <div class="stat"><span>○ <b>${ok}件</b></span><span>△ <b>${mb}件</b></span><span>× <b>${n-ok-mb-missing}件</b></span>${missing?`<span>未回答 <b>${missing}件</b></span>`:''}</div>
    <p>${mailHref
      ? `下のボタンを押すとメールが開きます。宛先・件名・本文は入力済みなので、<b>送信ボタンを押せば完了</b>です。`
      : `下のボタンでコピーして、<b>主催者${S.ev.o?`（${esc(S.ev.o)}さん）`:''}のチャットに貼って返信</b>してください。`}</p>
    <div class="actions">
      ${mailHref ? `<a href="${esc(mailHref)}"><button class="btn-primary btn-lg">メールアプリで送る</button></a>` : ''}
      ${gmailHref ? `<a href="${esc(gmailHref)}" target="_blank" rel="noopener"><button class="btn-primary btn-lg">Gmailで送る</button></a>` : ''}
      <button class="${mailHref ? 'btn-ghost' : 'btn-primary btn-lg'}" id="cpr">${mailHref ? 'コピーして返信' : '返信文をコピー'}</button>
    </div>
    ${mailHref ? `<p class="hint" style="margin:8px 0 0">「メールアプリ」はこのPCの既定のメール（Outlookなど）、「Gmail」はブラウザのGmailが開きます。どちらも宛先・件名・本文は入力済みなので、送信を押すだけです。</p>` : ''}
    <details style="margin:14px 0 0">
      <summary>回答コードを直接見る</summary>
      <div class="codebox" style="margin:10px 0 8px">${esc(code)}</div>
      <button class="btn-sm btn-ghost" id="cpc">コードだけコピー</button>
    </details>
    <p class="hint">回答内容はこのブラウザに保存されます。同じURLを開けば、あとから直して再送できます（新しいコードで上書きされます）。</p>
  </div>`;
  $('#cpr').onclick = ()=>copy(reply, '返信文をコピーしました');
  $('#cpc').onclick = ()=>copy(code, 'コードをコピーしました');
  box.scrollIntoView({behavior:'smooth', block:'start'});
  persistAns();
}

async function parseCodes(text){
  const found = text.match(/MTG1:[A-Za-z0-9_-]+/g) || [];
  const okList = [], errs = [];
  const fp = fpOf(S.ev);
  for (const token of found){
    let r;
    try{ r = await decB(token.slice(5)); }
    catch(err){ errs.push('コードが壊れています（途中で切れている可能性があります）'); continue; }
    if (r.h !== fp){ errs.push('別の打合せ、または候補日程を変更する前の回答コードです'); continue; }
    if (typeof r.i !== 'number' || !S.ev.p[r.i]){ errs.push('参加者を特定できないコードです'); continue; }
    if (typeof r.a !== 'string' || r.a.length !== S.ev.s.length){ errs.push('候補数が一致しないコードです'); continue; }
    okList.push({i:r.i, a:r.a, c:r.c||''});
  }
  return {okList, errs, total:found.length};
}

function renderTally(){
  const e = S.ev, fp = fpOf(e);
  const byIdx = new Map();
  for (const r of S.replies) byIdx.set(r.i, r);   // 同じ人の再回答は後のもので上書き
  const got = e.p.map((_, i)=>byIdx.has(i));
  const gotN = got.filter(Boolean).length;

  const rows = e.s.map((s, k)=>{
    let ok=0, mb=0, ng=0, none=0;
    const cells = e.p.map((_, i)=>{
      const r = byIdx.get(i);
      if (!r){ none++; return 'none'; }
      const v = r.a[k];
      if (v==='2'){ ok++; return 'ok'; }
      if (v==='1'){ mb++; return 'maybe'; }
      if (v==='0'){ ng++; return 'ng'; }
      none++; return 'none';
    });
    const rank = ng ? 3 : (mb ? 2 : (none ? 0 : 1));
    return {s, k, cells, ok, mb, ng, none, rank};
  });
  const order = [...rows].sort((a, b)=>{
    const w = r => r.ng ? 3 : (r.mb ? 2 : 1);
    return w(a)-w(b) || a.ng-b.ng || a.mb-b.mb || a.none-b.none || (a.s<b.s?-1:1);
  });
  const list = S.tallySort === 'date' ? rows : order;
  const best = gotN && order.length && !order[0].ng ? order[0] : null;   // 回答が無いうちは薦めない

  $('#tabbody').innerHTML = `
  <div class="card">
    <h2>回答コードを貼り付ける</h2>
    <p class="hint" style="margin-bottom:10px">メールやチャットで返ってきた文章をそのまま貼ってOKです（複数人分をまとめて貼れます）。コード部分だけ自動で読み取ります。<br>トップ画面の「回答コードを貼る」欄なら、どのMTGのものでもまとめて振り分けられます。</p>
    <textarea id="paste" placeholder="MTG1:xxxxxxxxxxxx&#10;MTG1:yyyyyyyyyyyy" style="min-height:80px"></textarea>
    <div class="actions">
      <button class="btn-primary" id="load">読み込む</button>
      ${S.replies.length?`<button class="btn-ghost btn-sm" id="clr">受信済みをすべて消す</button>`:''}
    </div>
    <div id="perr"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:10px">
      <h2 style="margin:0">集計</h2>
      <div style="display:flex; gap:6px">
        <button class="btn-sm ${S.tallySort==='date'?'':'btn-primary'}" data-sort="score">おすすめ順</button>
        <button class="btn-sm ${S.tallySort==='date'?'btn-primary':''}" data-sort="date">日時順</button>
      </div>
    </div>
    <div class="stat">
      <span>回答 <b>${gotN} / ${e.p.length}名</b></span>
      ${gotN < e.p.length ? `<span style="color:var(--maybe)">未回答：${e.p.filter((p, i)=>!got[i]).map(p=>esc(p[0])).join('、')}</span>` : '<span style="color:var(--ok)">全員回答済み</span>'}
    </div>
    ${!gotN ? `<p class="hint" style="margin:0 0 12px">まだ回答がありません。上の欄に回答コードを貼ると、ここに集計されます。回答を待たずに確定することもできます。</p>` : ''}
    ${best ? `<div class="note" style="margin:6px 0 12px"><h3>おすすめ</h3><p style="margin:0"><b>${esc(slotLabel(best.s))}〜${esc(timeLabel(addMin(best.s, e.m)))}</b> ${
      best.rank===1 ? '－ 全員が出席可能です。' :
      best.mb ? `－ ×はいません。${best.mb}名が「調整すれば出られる」と回答しています。` : '－ 現時点で×はいません。'
    }${best.none?`（未回答 ${best.none}名）`:''}</p></div>` : ''}
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>候補日時</th>${e.p.map((p, i)=>`<th class="c">${esc(p[0])}${got[i]?'':'<br><span style="font-weight:400;opacity:.6">未回答</span>'}</th>`).join('')}<th>判定</th><th></th></tr></thead>
        <tbody>
          ${list.map(r=>`
          <tr class="rank${r.rank}">
            <td class="dt">${esc(slotLabel(r.s))}<span class="to" style="font-weight:400; color:var(--muted)"> 〜${esc(timeLabel(addMin(r.s, e.m)))}</span></td>
            ${r.cells.map(c=>`<td class="c"><span class="mark ${c}">${c==='ok'?'○':c==='maybe'?'△':c==='ng'?'×':'？'}</span></td>`).join('')}
            <td>${
              r.ng ? `<span class="badge b3">×${r.ng}名</span>` :
              r.mb ? `<span class="badge b2">要調整 △${r.mb}</span>` :
              r.none ? `<span class="badge b0">未回答${r.none}名</span>` :
              `<span class="badge b1">全員OK</span>`
            }</td>
            <td><button class="btn-sm ${r.ng?'btn-ghost':'btn-primary'}" data-fix="${r.k}">確定</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${[...byIdx.values()].some(r=>r.c) ? `<div class="sep"></div><h3>参加者コメント</h3>
      ${[...byIdx.entries()].filter(([i, r])=>r.c).map(([i, r])=>`<p style="margin-bottom:6px"><b>${esc(e.p[i][0])}</b>：${esc(r.c)}</p>`).join('')}` : ''}
  </div>
  <div id="fixbox"></div>`;

  $('#load').onclick = async ()=>{
    const txt = $('#paste').value;
    if (!txt.trim()){ toast('回答コードを貼り付けてください'); return; }
    const {okList, errs, total} = await parseCodes(txt);
    for (const r of okList){
      S.replies = S.replies.filter(x=>x.i !== r.i);
      S.replies.push(r);
    }
    LS.set('mtg.rep.' + fp, S.replies);
    const msgs = [];
    if (okList.length) msgs.push(`<div class="note" style="margin:12px 0 0">${okList.map(r=>`<b>${esc(e.p[r.i][0])}</b>さんの回答を読み込みました。`).join('<br>')}</div>`);
    if (!total) msgs.push(`<div class="note err" style="margin:12px 0 0">「MTG1:」で始まる回答コードが見つかりませんでした。貼り付けた内容を確認してください。</div>`);
    else if (errs.length) msgs.push(`<div class="note err" style="margin:12px 0 0"><ul style="margin:0">${[...new Set(errs)].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`);
    renderTally();
    if (msgs.length) $('#perr').innerHTML = msgs.join('');
  };
  const clr = $('#clr');
  if (clr) clr.onclick = ()=>{
    if (!confirm('読み込んだ回答をすべて消します。よろしいですか？（参加者から再送してもらえば復元できます）')) return;
    S.replies = []; LS.set('mtg.rep.' + fp, []); renderTally();
  };
  view.querySelectorAll('[data-sort]').forEach(b=>b.onclick = ()=>{ S.tallySort = b.dataset.sort; renderTally(); });
  view.querySelectorAll('[data-fix]').forEach(b=>b.onclick = ()=>{
    S.fixed = +b.dataset.fix;
    renderFix(rows.find(r=>r.k === S.fixed));
  });
  if (S.fixed != null){
    const r = rows.find(x=>x.k === S.fixed);
    if (r) renderFix(r);
  }
  // タブのラベルは renderManage が描いているので、読み込み後にここで数字を追随させる
  const tb = view.querySelector('[data-tab="tally"]');
  if (tb) tb.textContent = '② 回答を集計する' + (gotN ? ` (${gotN})` : '');
}

/* ============================================================
   確定パネル
   ============================================================ */
function gcalUrl(slot){
  const e = S.ev, end = addMin(slot, e.m);
  const fmt = s => s.slice(0,8) + 'T' + s.slice(8,12) + '00';
  const emails = e.p.map(p=>p[1]).filter(Boolean);
  const noMail = e.p.filter(p=>!p[1]).map(p=>p[0]);
  const meet = (e.k||'').trim();
  const details = [
    e.d,
    // 場所欄をMeetに使えなかった場合だけ、説明欄にリンクを書く（二重掲載を避ける）
    meet && e.l ? 'Google Meet：' + meet : '',
    noMail.length ? (emails.length ? 'この方はメールアドレス未登録のため招待に入っていません。手動で追加してください：' : '参加者：') + noMail.join('、') : '',
  ].filter(Boolean).join('\n\n');
  const q = new URLSearchParams({action:'TEMPLATE', text:e.t, dates:fmt(slot)+'/'+fmt(end), ctz:'Asia/Tokyo'});
  if (details) q.set('details', details);
  if (e.l) q.set('location', e.l);
  else if (meet) q.set('location', meet);
  if (emails.length) q.set('add', emails.join(','));
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
function fixMsg(slot){
  const e = S.ev, meet = (e.k||'').trim();
  return [
    `【日程確定】${e.t}`,
    ``,
    `日時：${dateLabel(slot.slice(0,8))} ${timeLabel(slot)}〜${timeLabel(addMin(slot, e.m))}（${e.m}分）`,
    e.l ? `場所：${e.l}` : (meet ? `場所：オンライン` : `場所：オンライン（Google Meet／カレンダーの招待をご確認ください）`),
    meet ? `Google Meet：${meet}` : null,
    `参加者：${e.p.map(p=>p[0]).join('、')}`,
    e.d ? `\n内容：${e.d}` : null,
    ``,
    `ご調整ありがとうございました。カレンダーの招待をお送りします。`,
    e.o ? `\n${e.o}` : null,
  ].filter(x=>x!==null).join('\n');
}

function renderFix(r){
  const e = S.ev, slot = r.s, meet = (e.k||'').trim();
  const noMail = e.p.filter(p=>!p[1]).map(p=>p[0]);
  $('#fixbox').innerHTML = `
  <div class="card" style="border-color:var(--accent)">
    <div class="row" style="justify-content:space-between; align-items:flex-start">
      <div>
        <h2>この日程で確定する</h2>
        <p style="font-size:17px; font-weight:700; margin:6px 0 0">${esc(dateLabel(slot.slice(0,8)))} ${esc(timeLabel(slot))}〜${esc(timeLabel(addMin(slot, e.m)))}</p>
      </div>
      <button class="btn-x" id="fxclose" title="閉じる">✕</button>
    </div>
    ${r.ng ? `<div class="note err" style="margin-top:12px"><b>${r.ng}名が「×（出席できない）」と回答しています。</b>本当にこの日程でよいか確認してください。</div>` : ''}
    ${r.mb ? `<div class="note warn" style="margin-top:12px"><b>${r.mb}名が「△（調整すれば出られる）」と回答しています。</b>その方には、予定を動かしてもらう旨をひとこと添えてください。</div>` : ''}
    ${r.none ? `<div class="note warn" style="margin-top:12px"><b>${r.none}名が未回答です。</b></div>` : ''}

    <div class="sep"></div>
    <h3>手順1：Googleカレンダーに登録する</h3>
    <p class="hint" style="margin-bottom:10px">
      下のボタンで、件名・日時${e.p.some(p=>p[1])?'・参加者':''}${e.l?'・場所':''}${meet?'・Meetリンク':''}が入力済みの作成画面が開きます。あとは${meet?2:3}クリックです。
    </p>
    <ol class="hint" style="margin:0 0 12px; padding-left:1.4em">
      ${meet ? '' : '<li><b>「Google Meet の会議を追加」</b> を押す（Meetのリンクがここで発行されます）</li>'}
      <li><b>「保存」</b> を押す</li>
      <li>招待メールの確認が出たら <b>「送信」</b> を押す</li>
    </ol>
    ${meet ? `<p class="hint" style="margin:-4px 0 12px">※ 事前発行のリンクは${e.l?'説明欄':'場所欄'}に入ります。カレンダー上に「Google Meet に参加」ボタンとして出したい場合は、リンクを使わず「Google Meet の会議を追加」を押してください。</p>` : ''}
    <div class="actions">
      <a href="${esc(gcalUrl(slot))}" target="_blank" rel="noopener"><button class="btn-primary btn-lg">Googleカレンダーで作成する</button></a>
      <button class="btn-ghost btn-sm" id="cpcal">リンクをコピー</button>
    </div>
    ${noMail.length ? `<p class="hint" style="margin-top:10px">※ ${esc(noMail.join('、'))} はメールアドレスが未登録のため、招待相手に自動で入りません。カレンダー画面で追加してください。</p>` : ''}

    <div class="sep"></div>
    <h3>手順2：参加者に確定を連絡する</h3>
    <div class="codebox" style="white-space:pre-wrap; font-family:inherit; font-size:13.5px; user-select:text">${esc(fixMsg(slot))}</div>
    <div class="actions"><button class="btn-primary" id="cpfix">確定連絡文をコピー</button></div>

    <div class="sep"></div>
    <div class="actions">
      <button class="btn-primary" id="markdone">この日程で確定し、一覧を「済」にする</button>
      <span class="hint">一覧では下に移動し、調整中のものだけが上に残ります。あとから戻せます。</span>
    </div>
  </div>`;
  $('#markdone').onclick = ()=>{
    const list = loadList(), i = list.findIndex(x => x.fp === fpOf(e));
    if (i >= 0){ list[i].done = slot; LS.set('mtg.list', list); }
    S.fixed = null;
    toast('「済」にしました');
    location.hash = '';   // 一覧へ戻る
  };
  $('#fxclose').onclick = ()=>{ S.fixed = null; $('#fixbox').innerHTML = ''; };
  $('#cpcal').onclick = ()=>copy(gcalUrl(slot), 'カレンダー登録リンクをコピーしました');
  $('#cpfix').onclick = ()=>copy(fixMsg(slot), '確定連絡文をコピーしました');
  $('#fixbox').scrollIntoView({behavior:'smooth', block:'start'});
}

/* 起動 */
route();
</script>
</body>
</html>
